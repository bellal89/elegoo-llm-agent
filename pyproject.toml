[project]
name = "elegoo"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pyserial==3.5",
]

[dependency-groups]
dev = [
    "pyright==1.1.414",
    "pytest==9.2.0",
    "ruff==0.17.4",
]

[tool.pyright]
reportMatchNotExhaustive = true

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
pythonpath = ["."]
